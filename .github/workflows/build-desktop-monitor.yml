name: Build DENVique Desktop Monitor

on:
  push:
    branches: [main]
    paths:
      - "desktop-monitor/**"
      - ".github/workflows/build-desktop-monitor.yml"
  workflow_dispatch:

concurrency:
  group: denvique-desktop-monitor-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop-monitor
        run: npm install --no-audit --no-fund
      - name: Set release version
        working-directory: desktop-monitor
        run: npm version --no-git-tag-version --allow-same-version "0.1.${{ github.run_number }}"
      - name: Validate desktop app and extension source
        working-directory: desktop-monitor
        run: npm run check
      - name: Build Apple Silicon DMG
        working-directory: desktop-monitor
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: DENVique-Monitor-mac-arm64
          path: desktop-monitor/dist/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: desktop-monitor
        run: npm install --no-audit --no-fund
      - name: Set release version
        working-directory: desktop-monitor
        run: npm version --no-git-tag-version "0.1.${{ github.run_number }}"
      - name: Validate desktop app and extension source
        working-directory: desktop-monitor
        run: npm run check
      - name: Build Windows installer
        working-directory: desktop-monitor
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: DENVique-Monitor-Windows-x64
          path: desktop-monitor/dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DENVique-Monitor-*
          path: release-assets
          merge-multiple: true
      - name: Create verified cross-platform runtime update
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp desktop-monitor/engine.js release-assets/DENVique-Monitor-runtime.cjs
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const run = process.env.GITHUB_RUN_NUMBER;
          const version = `0.1.${run}`;
          const tag = `desktop-monitor-${run}`;
          const file = 'release-assets/DENVique-Monitor-runtime.cjs';
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const manifest = {
            version,
            sha256,
            downloadUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/DENVique-Monitor-runtime.cjs`
          };
          fs.writeFileSync('release-assets/DENVique-Monitor-runtime.json', JSON.stringify(manifest, null, 2));
          console.log(`Runtime update prepared: ${version} (${sha256})`);
          NODE
      - name: Publish latest desktop installers and runtime update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-monitor-${{ github.run_number }}
          name: DENVique Desktop Monitor ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
