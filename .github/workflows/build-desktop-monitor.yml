name: Build DENVique Desktop Monitor

on:
  push:
    branches: [main]
    paths:
      - "desktop-monitor/**"
      - ".github/workflows/build-desktop-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-monitor/package.json
      - name: Install dependencies
        run: npm install --prefix desktop-monitor --no-audit --no-fund
      - name: Build Apple Silicon DMG
        run: npm run build:mac --prefix desktop-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: DENVique-Monitor-mac-arm64
          path: desktop-monitor/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-monitor/package.json
      - name: Install dependencies
        run: npm install --prefix desktop-monitor --no-audit --no-fund
      - name: Build Windows installer
        run: npm run build:win --prefix desktop-monitor
      - uses: actions/upload-artifact@v4
        with:
          name: DENVique-Monitor-Windows-x64
          path: desktop-monitor/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish latest desktop installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-monitor-${{ github.run_number }}
          name: DENVique Desktop Monitor ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
