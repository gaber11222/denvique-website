name: DENVique macOS installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/denvique-macos-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
            artifact: DENVique-macOS-Apple-Silicon
          - target: x86_64-apple-darwin
            label: Intel
            artifact: DENVique-macOS-Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Generate app icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build macOS DMG
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
