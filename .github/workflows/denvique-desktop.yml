name: Build DENVique Desktop

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/denvique-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            label: macOS Apple Silicon
            artifact: DENVique-macOS-Apple-Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            label: macOS Intel
            artifact: DENVique-macOS-Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            label: Windows x64
            artifact: DENVique-Windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Generate application icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Build installer
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30
